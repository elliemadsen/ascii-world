<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interactive ASCII Scene</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Courier New", monospace;
      }

      #infoBox {
        position: absolute;
        padding: 10px;
        background: black;
        color: white;
        display: none;
        font-size: 14px;
        pointer-events: auto;
        border-radius: 0px; /* removed rounded corner */
        max-width: 200px;
      }

      #infoBox a {
        color: white;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="infoBox">
      This is a tree.<br />
      <a href="scene2.html">Go to another scene →</a>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
      import { AsciiEffect } from "three/addons/effects/AsciiEffect.js";
      import { OBJLoader } from "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/OBJLoader.js";

      let camera, scene, renderer, effect, controls;
      const keys = {};

      let tree;
      const PROXIMITY = 8; // distance at which text appears

      const infoBox = document.getElementById("infoBox");

      init();
      animate();

      function init() {
        // --- Scene ---
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // --- Camera ---
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.set(0, 2, 15);

        // --- Light ---
        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(10, 20, 10);
        scene.add(light);

        // --- Tree ---

        const objLoader = new OBJLoader();

        objLoader.load(
          "models/landscape/79-low-poly-tree/Low Poly Tree.obj",
          (tree) => {
            tree.scale.setScalar(2);
            tree.position.set(0, 0, -10);
            tree.rotation.y = Math.random() * Math.PI * 2;
            scene.add(tree);
          }
        );

        // --- Renderer ---
        renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.style.display = "none"; // only ASCII shown
        document.body.appendChild(renderer.domElement);

        // --- ASCII Effect ---
        effect = new AsciiEffect(renderer, " .:-=+*#%@", { invert: true });
        effect.setSize(window.innerWidth, window.innerHeight);

        // force ASCII to be black background
        effect.domElement.style.backgroundColor = "black";
        effect.domElement.style.color = "white";
        effect.domElement.style.fontFamily = '"Courier New", monospace';

        effect.domElement.style.pointerEvents = "none";
        document.body.appendChild(effect.domElement);

        // --- Controls ---
        controls = new PointerLockControls(camera, document.body);
        document.body.addEventListener("click", () => controls.lock());

        document.addEventListener("keydown", (e) => (keys[e.key] = true));
        document.addEventListener("keyup", (e) => (keys[e.key] = false));

        window.addEventListener("resize", onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        effect.setSize(window.innerWidth, window.innerHeight);
      }

      function updateMovement() {
        const speed = 0.2;
        if (keys["ArrowUp"]) controls.moveForward(speed);
        if (keys["ArrowDown"]) controls.moveForward(-speed);
        if (keys["ArrowLeft"]) controls.getObject().rotation.y += 0.03;
        if (keys["ArrowRight"]) controls.getObject().rotation.y -= 0.03;
      }

      function updateInfoBox() {
        const dist = camera.position.distanceTo(tree.position);

        if (dist < PROXIMITY) {
          infoBox.style.display = "block";

          // project tree position to 2d screen coords
          const vector = tree.position.clone();
          vector.project(camera);

          const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
          const y = -(vector.y * 0.5 - 0.5) * window.innerHeight;

          infoBox.style.left = x + "px";
          infoBox.style.top = y + "px";
        } else {
          infoBox.style.display = "none";
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        updateMovement();
        updateInfoBox();

        effect.render(scene, camera);
      }
    </script>
  </body>
</html>
